name: factory

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  # Reconciliação: inicia ideias que ainda não viraram projeto.
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      instrucao:
        description: "Instrução opcional para o agente"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

# Uma execução por vez no repositório inteiro: evita duas sessões
# escrevendo state.json ao mesmo tempo. Eventos ficam enfileirados.
concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  run:
    # Só o dono do repositório aciona a fábrica (o repo pode ser público).
    if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    # Teto rígido do job; o agente mira config.run_timeout_minutes (90).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes da fábrica
        run: |
          pip install --quiet pytest
          python -m pytest -q factory/tests

      - name: Guard (decide se o agente acorda)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/scripts/guard.py

      - name: Configurar git
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Claude Code CLI direto (sem ação intermediária): saída completa
      # gravada em agent.jsonl para diagnóstico. O navegador de QA não é
      # instalado aqui; o agente usa o Chrome do runner só quando precisa.
      - name: Agente (Claude Code)
        id: agent
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 92
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECRET_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT: ${{ steps.guard.outputs.prompt }}
          MAX_TURNS: ${{ steps.guard.outputs.max_turns }}
        run: |
          set -o pipefail
          if [ -n "$SECRET_API_KEY" ]; then export ANTHROPIC_API_KEY="$SECRET_API_KEY"; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$SECRET_API_KEY" ]; then
            echo "Nenhum segredo de autenticação configurado (CLAUDE_CODE_OAUTH_TOKEN)." | tee "$RUNNER_TEMP/agent.jsonl"; exit 1
          fi
          npm install -g --silent @anthropic-ai/claude-code
          claude --version
          claude -p "$PROMPT" \
            --max-turns "$MAX_TURNS" \
            --permission-mode acceptEdits \
            --allowedTools "Bash" "Read" "Write" "Edit" "Glob" "Grep" "WebFetch" "WebSearch" "TodoWrite" \
            --output-format stream-json --verbose 2>&1 | tee "$RUNNER_TEMP/agent.jsonl"

      # Falha visível: job vermelho + comentário na issue se o agente
      # falhou ou se a ideia não virou projeto.
      - name: Verificar resultado
        id: verify
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/scripts/verify.py "${{ steps.agent.outcome }}" "${{ steps.guard.outputs.expect_issue }}"

      # Diagnóstico persistente: em falha, a saída do agente vai para o
      # branch `diagnostics` (legível sem a interface do Actions).
      - name: Salvar diagnóstico
        if: failure() && steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cp "$RUNNER_TEMP/agent.jsonl" /tmp/agent.jsonl 2>/dev/null || echo "agente não gerou saída" > /tmp/agent.jsonl
          git init -q /tmp/d && cd /tmp/d
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch -q --depth 1 origin diagnostics; then git checkout -q FETCH_HEAD; else git checkout -q --orphan diagnostics; fi
          mkdir -p runs && cp /tmp/agent.jsonl "runs/$RUN_ID.jsonl"
          git add runs && git -c user.name=factory-bot -c user.email=factory-bot@users.noreply.github.com commit -qm "diagnóstico $RUN_ID"
          git push -q origin HEAD:diagnostics

      # Commits feitos com GITHUB_TOKEN não disparam outras workflows;
      # workflow_dispatch é a exceção, então o painel é republicado aqui.
      - name: Republicar painel
        if: always() && steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" || true
