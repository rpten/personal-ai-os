name: factory

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  # Reconciliação: inicia ideias que ainda não viraram projeto.
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      instrucao:
        description: "Instrução opcional para o agente"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

# Uma execução por vez no repositório inteiro: evita duas sessões
# escrevendo state.json ao mesmo tempo. Eventos ficam enfileirados.
concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  run:
    # Só o dono do repositório aciona a fábrica (o repo pode ser público).
    if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    # Teto rígido do job; o agente mira config.run_timeout_minutes (90).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes da fábrica
        run: |
          pip install --quiet pytest
          python -m pytest -q factory/tests

      - name: Guard (decide se o agente acorda)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/scripts/guard.py

      - name: Navegador para QA
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Configurar git
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Agente (Claude Code)
        id: agent
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.guard.outputs.prompt }}
          claude_args: >-
            --max-turns ${{ steps.guard.outputs.max_turns }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,TodoWrite"

      # Falha visível: job vermelho + comentário na issue se o agente
      # falhou ou se a ideia não virou projeto.
      - name: Verificar resultado
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/scripts/verify.py "${{ steps.agent.outcome }}" "${{ steps.guard.outputs.expect_issue }}"

      # Commits feitos com GITHUB_TOKEN não disparam outras workflows;
      # workflow_dispatch é a exceção, então o painel é republicado aqui.
      - name: Republicar painel
        if: always() && steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" || true

  # Diagnóstico persistente: em caso de falha, o log do job vai para o
  # branch `diagnostics` (segredos já vêm mascarados pelo GitHub), onde o
  # agente e as revisões conseguem lê-lo sem acesso à interface do Actions.
  diagnose:
    needs: run
    if: always() && needs.run.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Salvar log da execução
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" -q '.jobs[] | select(.name=="run") | .id')
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > log.txt || echo "log indisponível" > log.txt
          git init -q d && cd d
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$REPO"
          git fetch -q --depth 1 origin diagnostics && git checkout -q FETCH_HEAD || git checkout -q --orphan diagnostics
          mkdir -p runs && mv ../log.txt "runs/$RUN_ID.txt"
          ls -t runs | tail -n +31 | sed 's#^#runs/#' | xargs -r git rm -q --cached 2>/dev/null; ls -t runs | tail -n +31 | sed 's#^#runs/#' | xargs -r rm -f
          git add runs && git -c user.name=factory-bot -c user.email=factory-bot@users.noreply.github.com commit -qm "diagnóstico $RUN_ID"
          git push -q origin HEAD:diagnostics
