name: factory

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  # Reconciliação: caixa de entrada, ideias não iniciadas e eventos perdidos.
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      instrucao:
        description: "Instrução opcional para o agente"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  # Decide, sem LLM, se o agente roda. Quando não roda, o job "agent" aparece
  # como pulado (cinza) e o motivo fica no resumo da execução e no ledger.
  guard:
    # Só o dono do repositório aciona a fábrica (o repo é público).
    if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
      slug: ${{ steps.guard.outputs.slug }}
      prompt: ${{ steps.guard.outputs.prompt }}
      max_turns: ${{ steps.guard.outputs.max_turns }}
      expect_issue: ${{ steps.guard.outputs.expect_issue }}
      key: ${{ steps.guard.outputs.key }}
      react_path: ${{ steps.guard.outputs.react_path }}
      prev_status: ${{ steps.guard.outputs.prev_status }}
      issue: ${{ steps.guard.outputs.issue }}
      inbox_path: ${{ steps.guard.outputs.inbox_path }}
      event: ${{ steps.guard.outputs.event }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet jsonschema pytest
      - name: Testes da fábrica
        run: python -m pytest -q factory/tests
      - name: Guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python factory/scripts/guard.py

  agent:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Teto rígido; o agente mira config.run_timeout_minutes (90).
    timeout-minutes: 100
    # Um projeto por vez (ideias novas e instruções gerais compartilham "new").
    concurrency:
      group: factory-${{ needs.guard.outputs.slug || 'new' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet jsonschema

      - name: Sinalizar execução (👀)
        if: needs.guard.outputs.react_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "${{ needs.guard.outputs.react_path }}" -f content=eyes || true

      - name: Configurar git
        run: |
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Claude Code CLI direto: saída completa em agent.jsonl para diagnóstico.
      - name: Agente (Claude Code)
        id: agent
        continue-on-error: true
        timeout-minutes: 92
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECRET_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ needs.guard.outputs.prompt }}
          MAX_TURNS: ${{ needs.guard.outputs.max_turns }}
        run: |
          set -o pipefail
          if [ -n "$SECRET_API_KEY" ]; then export ANTHROPIC_API_KEY="$SECRET_API_KEY"; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$SECRET_API_KEY" ]; then
            echo "Nenhum segredo de autenticação configurado (CLAUDE_CODE_OAUTH_TOKEN)." | tee "$RUNNER_TEMP/agent.jsonl"; exit 1
          fi
          npm install -g --silent @anthropic-ai/claude-code
          claude --version
          claude -p "$PROMPT" \
            --max-turns "$MAX_TURNS" \
            --permission-mode acceptEdits \
            --allowedTools "Bash" "Read" "Write" "Edit" "Glob" "Grep" "WebFetch" "WebSearch" "TodoWrite" \
            --output-format stream-json --verbose 2>&1 | tee "$RUNNER_TEMP/agent.jsonl"

      # Verde só se o trabalho foi registrado em main; senão vermelho + aviso.
      - name: Verificar resultado
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          SLUG: ${{ needs.guard.outputs.slug }}
          EXPECT_ISSUE: ${{ needs.guard.outputs.expect_issue }}
          PREV_STATUS: ${{ needs.guard.outputs.prev_status }}
          KEY: ${{ needs.guard.outputs.key }}
          REACT_PATH: ${{ needs.guard.outputs.react_path }}
          ISSUE: ${{ needs.guard.outputs.issue }}
          INBOX_PATH: ${{ needs.guard.outputs.inbox_path }}
          EVENT: ${{ needs.guard.outputs.event }}
        run: python factory/scripts/verify.py

      - name: Salvar diagnóstico
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cp "$RUNNER_TEMP/agent.jsonl" /tmp/agent.jsonl 2>/dev/null || echo "agente não gerou saída" > /tmp/agent.jsonl
          git init -q /tmp/d && cd /tmp/d
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch -q --depth 1 origin diagnostics; then git checkout -q FETCH_HEAD; else git checkout -q --orphan diagnostics; fi
          mkdir -p runs && cp /tmp/agent.jsonl "runs/$RUN_ID.jsonl"
          git add runs && git -c user.name=factory-bot -c user.email=factory-bot@users.noreply.github.com commit -qm "diagnóstico $RUN_ID"
          git push -q origin HEAD:diagnostics

      # Commits com GITHUB_TOKEN não disparam workflows; workflow_dispatch sim.
      - name: Republicar painel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" || true
