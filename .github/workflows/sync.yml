name: sync

# Coleta agendada de dados externos para os projetos, sem contas novas.
# Cada projeto pode ter projects/<slug>/sync/run.sh; ele roda a cada hora
# com OUT=projects/<slug>/public/data e o resultado é publicado no Pages.

on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: ["projects/*/sync/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rodar coletores
        run: |
          status=0
          for script in projects/*/sync/run.sh; do
            [ -f "$script" ] || continue
            slug=$(echo "$script" | cut -d/ -f2)
            export OUT="$PWD/projects/$slug/public/data"
            mkdir -p "$OUT"
            echo "::group::$slug"
            if ! (cd "projects/$slug/sync" && timeout 300 bash run.sh); then
              echo "::error::coletor de $slug falhou"; status=1
            fi
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_ENV"
      - name: Publicar dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/*/public/data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "sync: dados atualizados"
            git pull -q --rebase origin main && git push -q origin HEAD:main
            gh workflow run pages.yml -R "$GITHUB_REPOSITORY" || true
          fi
          exit "$status"
